<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">个人科研 Codex Research Loop</title>
  <desc id="desc">展示 Git 基线、THINK 只读构思、CURRENT、EXPLORE BUILD FORMAL 三种任务、执行检查、内容级 Closeout，以及知识、代码、证据和临时内容四类结果去向。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 38px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .subtitle { font: 400 19px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #475569; }
      .head { font: 700 21px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .body { font: 400 16px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #334155; }
      .small { font: 400 14px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #475569; }
      .white-head { font: 700 21px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #ffffff; }
      .white-body { font: 400 16px 'Noto Sans CJK SC','Microsoft YaHei',sans-serif; fill: #dbeafe; }
      .line { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 9 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#bg)"/>
  <text x="800" y="54" text-anchor="middle" class="title">个人科研 Codex Research Loop</text>
  <text x="800" y="88" text-anchor="middle" class="subtitle">Git 基线 · 先构思 · 一次一个有边界的任务 · 检查结果 · 人工确认内容</text>

  <g filter="url(#shadow)">
    <rect x="90" y="120" width="360" height="105" rx="18" fill="#ffffff" stroke="#0891b2" stroke-width="2.5"/>
  </g>
  <text x="270" y="157" text-anchor="middle" class="head">THINK · 只读构思</text>
  <text x="270" y="185" text-anchor="middle" class="body">理解问题 · 检查必要上下文 · 比较方案</text>
  <text x="270" y="208" text-anchor="middle" class="small">形成待确认计划，不修改文件</text>

  <g filter="url(#shadow)">
    <rect x="570" y="120" width="460" height="105" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <text x="800" y="157" text-anchor="middle" class="head">PROJECT · Idea · Claim</text>
  <text x="800" y="185" text-anchor="middle" class="body">长期边界、研究问题、理论与可证伪主张</text>
  <text x="800" y="208" text-anchor="middle" class="small">决定研究什么，以及什么结论值得接受</text>

  <g filter="url(#shadow)">
    <rect x="1150" y="120" width="360" height="105" rx="18" fill="#ffffff" stroke="#9333ea" stroke-width="2.5"/>
  </g>
  <text x="1330" y="157" text-anchor="middle" class="head">Researcher</text>
  <text x="1330" y="185" text-anchor="middle" class="body">确认计划 · 阶段变化 · 科学判断</text>
  <text x="1330" y="208" text-anchor="middle" class="small">真实机器人运动仍需单独批准</text>

  <path d="M450 173 L560 173" class="line"/>
  <path d="M1040 173 L1140 173" class="line"/>
  <path d="M1330 225 C1330 270 1100 270 1010 290" class="line"/>
  <path d="M800 225 L800 278" class="line"/>

  <g filter="url(#shadow)">
    <rect x="300" y="282" width="1000" height="92" rx="20" fill="#172554"/>
  </g>
  <text x="800" y="318" text-anchor="middle" class="white-head">CURRENT</text>
  <text x="800" y="347" text-anchor="middle" class="white-body">对象指针 · 一句话接受状态 · 主要不确定性 · 下一项决策</text>

  <path d="M800 374 L800 408" class="line"/>

  <g filter="url(#shadow)">
    <rect x="90" y="412" width="1420" height="245" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <text x="125" y="452" class="head">TASK</text>
  <text x="1475" y="452" text-anchor="end" class="small">Question · Progress · Context · Allowed Changes · Budget · Done When · Outputs</text>

  <g filter="url(#shadow)">
    <rect x="125" y="480" width="410" height="125" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <rect x="595" y="480" width="410" height="125" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect x="1065" y="480" width="410" height="125" rx="16" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  </g>
  <text x="330" y="518" text-anchor="middle" class="head">EXPLORE</text>
  <text x="330" y="547" text-anchor="middle" class="body">理论、反例、支持决策的最小计算</text>
  <text x="330" y="575" text-anchor="middle" class="small">默认 scratch/&lt;task-id&gt;/ · 不成为正式资产</text>

  <text x="800" y="518" text-anchor="middle" class="head">BUILD</text>
  <text x="800" y="547" text-anchor="middle" class="body">实现已接受的理论或工程能力</text>
  <text x="800" y="575" text-anchor="middle" class="small">Build Contract · 正式 owner · 性质与测试</text>

  <text x="1270" y="518" text-anchor="middle" class="head">FORMAL</text>
  <text x="1270" y="547" text-anchor="middle" class="body">按冻结 Protocol 产生论文级证据</text>
  <text x="1270" y="575" text-anchor="middle" class="small">协议结果 ≠ 研究者接受 · 全部结果记录</text>

  <text x="800" y="636" text-anchor="middle" class="small">一次 TASK 只选择一种 Type；改变研究含义或 Type 时停止并重新准备 TASK</text>

  <path d="M800 657 L800 688" class="line"/>

  <g filter="url(#shadow)">
    <rect x="300" y="692" width="1000" height="90" rx="20" fill="#1e40af"/>
  </g>
  <text x="800" y="728" text-anchor="middle" class="white-head">执行 + Sensors</text>
  <text x="800" y="757" text-anchor="middle" class="white-body">diff · 测试 · 性质检查 · 校验值 · 证据审查；科学判断仍由用户接受</text>

  <path d="M800 782 L800 812" class="line"/>

  <g filter="url(#shadow)">
    <rect x="420" y="816" width="760" height="84" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  </g>
  <text x="800" y="850" text-anchor="middle" class="head">内容级 Closeout + 用户确认</text>
  <text x="800" y="878" text-anchor="middle" class="body">完整文本 / diff · 准确删除路径 · 接受提交；内容变化则重新批准</text>

  <path d="M800 900 L800 928" class="line"/>
  <path d="M205 928 L1395 928" stroke="#475569" stroke-width="2.5" fill="none"/>
  <path d="M205 928 L205 950" class="line"/>
  <path d="M600 928 L600 950" class="line"/>
  <path d="M1000 928 L1000 950" class="line"/>
  <path d="M1395 928 L1395 950" class="line"/>

  <g filter="url(#shadow)">
    <rect x="80" y="954" width="250" height="92" rx="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="445" y="954" width="310" height="92" rx="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="845" y="954" width="310" height="92" rx="15" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <rect x="1270" y="954" width="250" height="92" rx="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  </g>
  <text x="205" y="990" text-anchor="middle" class="head">更新知识</text>
  <text x="205" y="1018" text-anchor="middle" class="small">Idea 完整结论 · CURRENT 指针</text>
  <text x="600" y="990" text-anchor="middle" class="head">维护代码</text>
  <text x="600" y="1018" text-anchor="middle" class="small">src · ros2_ws · tests</text>
  <text x="1000" y="990" text-anchor="middle" class="head">保留证据</text>
  <text x="1000" y="1018" text-anchor="middle" class="small">Run · 协议结果 · 研究者验证</text>
  <text x="1395" y="990" text-anchor="middle" class="head">删除临时</text>
  <text x="1395" y="1018" text-anchor="middle" class="small">确认后的 scratch 路径</text>

  <path d="M205 1046 C205 1080 45 1080 45 328 C45 270 440 260 700 292" class="loop"/>
  <text x="68" y="800" transform="rotate(-90 68 800)" class="small">回到 CURRENT，选择下一项研究决策</text>
</svg>
