  <rect x="0" y="0" width="1600" height="1180" fill="#f9f9f7"/>

  <!-- ================= 页眉 ================= -->
  <text x="60" y="62" font-size="28" font-weight="700" fill="#0b0b0b">个人科研 Research Loop — 文档驱动的单任务科研循环</text>
  <text x="60" y="94" font-size="14.5" fill="#52514e">THINK 只读构思 → 有边界的 TASK → 执行与 Sensors → Closeout 人工确认 → 回到 CURRENT 选择下一项决策</text>

  <!-- 图例：三种 Task Type -->
  <text x="1340" y="36" font-size="12" fill="#898781" text-anchor="middle">三种 Task Type</text>
  <g>
