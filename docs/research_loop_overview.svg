<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" font-family="Noto Sans CJK SC, system-ui, sans-serif">
  <!-- ================= 调色板（dataviz 参考实例，light 模式） =================
       分类：blue #2a78d6 / orange #eb6834 / aqua #1baf7a / violet #4a3aa7
       状态：good #0ca30c / warning #fab219 / critical #d03b3b
       墨色：primary #0b0b0b / secondary #52514e / muted #898781
       表面：page #f9f9f7 / card #fcfcfb / hairline #e1e0d9 -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#898781"/>
