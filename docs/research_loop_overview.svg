    <text x="92" y="532" font-size="12" fill="#0b0b0b">预期行为 · 停止方式</text>
    <text x="92" y="560" font-size="12" font-weight="700" fill="#0b0b0b">批准后才执行 · 失败后不自动重试</text>

    <text x="84" y="652" font-size="12.5" fill="#52514e">Codex 决定</text>
    <text x="84" y="672" font-size="12.5" font-weight="700" fill="#0b0b0b">How · Where · Check · Clean</text>
  </g>

  <!-- ================= 中列：主循环 ================= -->

  <!-- THINK -->
  <g>
    <rect x="380" y="140" width="720" height="118" rx="10" fill="#eaf2fb" stroke="#e1e0d9"/>
    <rect x="380" y="140" width="4" height="118" rx="2" fill="#2a78d6"/>
