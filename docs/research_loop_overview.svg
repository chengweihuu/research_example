    <text x="88" y="359" font-size="12.5" font-weight="700" fill="#2a78d6" text-anchor="middle">4</text>
    <text x="112" y="360" font-size="13.5" fill="#0b0b0b">逐项确认 Closeout Plan</text>

    <circle cx="88" cy="395" r="12" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
    <text x="88" y="399" font-size="12.5" font-weight="700" fill="#2a78d6" text-anchor="middle">5</text>
    <text x="112" y="400" font-size="13.5" fill="#0b0b0b">接受 / 拒绝正式证据</text>

    <line x1="84" y1="432" x2="296" y2="432" stroke="#e1e0d9"/>

